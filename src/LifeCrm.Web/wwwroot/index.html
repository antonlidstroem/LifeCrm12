<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0C1520" />
    <meta name="description" content="LifeCrm — Relationship & Donation Management" />
    <title>LifeCrm</title>
    <base href="/" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link href="css/lifecrm-dialog-fixes.css" rel="stylesheet" />

    <!-- DM Sans + IBM Plex Mono — loaded early to prevent FOUT -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
          rel="stylesheet" />

    <!-- MudBlazor -->
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />

    <!-- LifeCrm design system — must come AFTER MudBlazor to allow overrides -->
    <link href="css/app.css" rel="stylesheet" />

    <style>
        /* Inline critical CSS: prevent flash of unstyled background */
        html, body {
            background: #0C1520;
            color: #E8F0F8;
            margin: 0;
            font-family: 'DM Sans', system-ui, sans-serif;
        }

        /* Loading screen shown before Blazor boots */
        #app-loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0C1520;
            gap: 20px;
            z-index: 9999;
        }

        .lc-boot-logo {
            width: 48px;
            height: 48px;
            background: #2E8EFF;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            animation: lc-pulse 1.4s ease-in-out infinite;
        }

        .lc-boot-text {
            font-size: 13px;
            color: #3D5270;
            letter-spacing: 0.05em;
        }

        @keyframes lc-pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.7;
                transform: scale(0.96);
            }
        }

        #app-loading.hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 300ms ease;
        }
    </style>
</head>

<body>
    <div id="app">
        <div id="app-loading">
            <div class="lc-boot-logo">L</div>
            <span class="lc-boot-text">Loading LifeCrm…</span>
        </div>
    </div>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>

    <script>
        // Behåll bara dina egna hjälpare, ta bort Blazor.start()
        window.lifecrm = {
            downloadFile: function (filename, base64, mimeType) {
                const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
                const blob = new Blob([bytes], { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = filename;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
            }
        };
    </script>
</body>
</html>
